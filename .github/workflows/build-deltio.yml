name: Build Deltio Image

# Builds this Cula fork of the Deltio Pub/Sub emulator and pushes it to the same
# Google Artifact Registry as the rest of our service images. The provider-backend
# e2e shards consume this image when `PUBSUB_EMULATOR_BACKEND=deltio` is set; the
# runners already have GAR creds via the existing setup-project chain, so no
# extra auth gymnastics are needed at consumption time.
#
# It also publishes the immutable `cula-<shortsha>` tag to Docker Hub, because
# that is where cula-platform actually pulls the emulator from (see
# `DEFAULT_DELTIO_IMAGE` in `packages/shared-testcontainers`, and the digest-pinned
# `docker-compose.yml`, which uses Docker Hub so local dev works without GAR
# credentials). Only the sha tag goes to Docker Hub: a mutable `latest` moving
# under CI is what made CUL-7139 hard to reason about, so consumers get a tag that
# names its build.
#
# Triggers:
# - On push to `cula/main` — keeps the `cula-main` image in sync with the fork.
# - Manually via workflow_dispatch — builds whichever branch the run is
#   dispatched on; override the published tag with the `tag` input.
#
# In both cases the build uses the commit that triggered the run (plain
# checkout), so a feature branch can publish a test image before merge.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (under <registry>/deltio:<tag>)"
        required: true
        default: cula-main
  push:
    branches:
      - cula/main

permissions:
  contents: read
  id-token: write
  # Required for docker/build-push-action to write to the GitHub Actions
  # cache (cache-to: type=gha). Without this, the cache writes silently
  # fail and every multi-arch build redoes the full work.
  actions: write

env:
  REGISTRY: europe-docker.pkg.dev
  IMAGE_REPO: europe-docker.pkg.dev/dev-cula-technologies/docker-images/deltio
  DOCKERHUB_REPO: culatech/deltio
  GOOGLE_CLOUD_KEY: ${{ secrets.DEV_GOOGLE_CLOUD_KEY }}

concurrency:
  group: build-deltio-${{ github.event.inputs.tag || 'cula-main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve build SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # The Docker Hub tag is only added when the token is configured, so a repo
      # without the secret still produces its GAR images instead of failing the
      # build outright.
      - name: Compute image tags
        id: tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'cula-main' }}
          SHA_TAG: cula-${{ steps.sha.outputs.short }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_REPO}:${TAG}"
            echo "${IMAGE_REPO}:${SHA_TAG}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "${DOCKERHUB_REPO}:${SHA_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN is not set, skipping the Docker Hub push; cula-platform pulls ${DOCKERHUB_REPO} and will not see this build."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Google Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ env.GOOGLE_CLOUD_KEY }}

      - name: Login to Docker Hub
        if: steps.tags.outputs.dockerhub == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || 'culatech' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No QEMU setup: the build stage is pinned to the native build platform
      # (`FROM --platform=$BUILDPLATFORM`) and cross-compiles each target with
      # cargo-zigbuild, and the final stage is `FROM scratch`. No target-arch
      # code is ever executed, so arm64 builds need no emulation.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=deltio
          cache-to: type=gha,mode=max,scope=deltio

      - name: Summary
        run: |
          {
            echo "## Deltio image built"
            echo ""
            echo "Source SHA: \`${{ steps.sha.outputs.sha }}\`"
            echo ""
            echo "Tags pushed:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "${{ steps.tags.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
