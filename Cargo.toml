[package]
name = "deltio"
version = "0.7.0"
edition = "2024"
authors = ["Jeff Hansen"]
description = "A Google Cloud Pub/Sub emulator alternative for local testing and CI"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "parking_lot", "signal"] }
async-stream = { version = "0.3.6" }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
async-trait = "0.1.92"
thiserror = "2.0.20"
tower = { version = "0.5.3", features = ["full"] }
bytes = "1.12.1"
base64 = "0.23.1"
futures = "0.3.34"
parking_lot = "0.12.5"
log = "0.4.34"
env_logger = "0.11.11"
lazy_static = "1.5.0" # Used in tests; production code uses std::sync::LazyLock
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
hyper = { version = "1.11.1", features = ["server", "http1"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.20", features = ["tokio"] }

# MiMalloc does not currently cross-compile for `i686-unknown-linux-musl` target,
# so we'll disable MiMalloc for x86 Linux for now.
[target.'cfg(not(all(target_arch = "x86", target_os = "linux")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
uuid = { version = "1.26.0", features = ["v4", "fast-rng"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
rand = "0.10.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bench]]
name = "data_structures"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "grpc_concurrent"
harness = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
rpath = false
codegen-units = 1
incremental = true
